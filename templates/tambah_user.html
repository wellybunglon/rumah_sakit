<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Tambah User</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='main.css') }}">

</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>RS SEHAT</h2>

    <a href="/">Dashboard</a>

    <a href="/users">
        User / Akun
    </a>

</div>

<!-- MAIN -->
<div class="main">

    <div class="header">
        <h1>Tambah User</h1>
    </div>

    <div class="table-container">

    <div class="form-container">

        <form method="POST">

            <div class="form-group">

            <label>Nama</label>

            <input type="text"
            name="nama"
            required>

            </div>

            <div class="form-group">
            
                <label>Username</label>
    
                <input type="text"
                name="username"
                required>
            </div>

            <div class="form-group">

                <label>Password</label>
    
                <input type="password"
                name="password"
                required>
            </div>

            <div class="form-group">

                <label>Level</label>
    
                <select name="level">
    
                    <option value="admin">
                        Admin
                    </option>
    
                    <option value="dokter">
                        Dokkter
                    </option>
                    
                    <option value="perawat">
                        Perawat
                    </option>
    
                </select>
            </div>

            <button type="submit" class="btn">
                Simpan
            </button>

        </form>

    </div>

</div>

</body>
</html>
