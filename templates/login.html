<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login - RS Sehat</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='login.css') }}">

</head>
<body>

    <div class="login-box">

        <h1>RS SEHAT</h1>

        <!-- pesan error -->
        {% if error %}
            <p style="color:red; text-align:center;">
                {{ error }}
            </p>
        {% endif %}

        <!-- FORM LOGIN -->
        <form action="/login" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

        </form>

    </div>

</body>
</html>
